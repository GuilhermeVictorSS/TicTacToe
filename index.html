<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link href="tictactoe.css" rel="stylesheet" type="text/css">
</head>
<body>
    <h1>Jogo da Velha 5000 Pro Max Ultra</h1>
    <div id="container">
        <div class="rows">
            <button id="item1"></button>
            <button id="item2"></button>
            <button id="item3"></button>
        </div>
        <div class="rows">
            <button id="item4"></button>
            <button id="item5"></button>
            <button id="item6"></button>
        </div>
        <div class="rows">
            <button id="item7"></button>
            <button id="item8"></button>
            <button id="item9"></button>
        </div>
    </div>
    <h2 id="player" style="color: white;">Turno do X</h2>
    <div id="playerinfo">
        <div id="playerbox1">
            <h1 id="p1name">?</h1>
            <h2 id="p1wins">Wins:</h2>
        </div>
        <div id="box">
            <h1 id="draw">Empates:</h1>
        </div>
        <div id="playerbox2">
            <h1 id="p2name">?</h1>
            <h2 id="p2wins">Wins:</h2>
        </div>
    </div>
    <button id="reset">RESET</button>
    <script src="tictactoe.js"></script>
</body>
</html>
